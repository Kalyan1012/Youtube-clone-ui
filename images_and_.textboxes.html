<!doctype html>
<html>
  <head>
    <style>
      .thumbnail {
        width: 200px;
        height: 200px;
        border-radius: 100px;
        object-fit: cover;
        object-position: center;
      }
      .picture {
        border-radius: 15px;
        border-width: 1px;
        border-style: solid;
        font-size: 16px;
        padding-left: 15px;
        padding-right: 15px;
        padding-top: 12px;
        padding-bottom: 12px;
      }
      .google {
        margin-left: 10px;
        font-size: 16px;
        padding-left: 15px;
        padding-right: 15px;
        padding-top: 12px;
        padding-bottom: 12px;
        border-radius: 30px;
        box-shadow: 0px 1px 5px rgba(0, 0, 0, 0.5);
        border: none;
      }
      .profilepic {
        width: 50px;
        height: 50px;
        border-radius: 25px;
        margin-right: 10px;
        vertical-align: middle;
        object-fit: cover;
      }
      .textborder {
        border: none;
        font-size: 16px;
        width: 300px;
        vertical-align: middle;
      }
      .tweet-button {
        background-color: rgb(29, 155, 240);
        color: white;
        font-weight: bold;
        font-size: 16px;
        padding-left: 18px;
        padding-right: 18px;
        padding-top: 12px;
        padding-bottom: 12px;
        vertical-align: middle;
        border: none;
        border-radius: 24px;
      }
    </style>
  </head>
  <body>
    <img class="thumbnail" src="Thumbnails/thumbnail-1.webp" />
    <input class="picture" type="text" placeholder="Search" />
    <input
      class="google"
      type="text"
      placeholder="Search Google or type a URL"
    />
    <br />
    <img class="profilepic" src="Thumbnails/thumbnail-1.webp" />
    <input class="textborder" type="text" placeholder="What's happening?" />
    <button class="tweet-button">Tweet</button>
  </body>
</html>
