<!DOCTYPE html>
<html>

<head>
    <title>exercise</title>
    <style>
        .container {
            background-color:pink;
            width: 300px;
            border-style: solid;
            border-radius: 6px;
            border-width: 1px;
            margin-bottom: 200px;
        }

        .flexbox {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding-top: 6px;
            padding-bottom: 6px;
            padding-left: 12px;
            padding-right: 12px;

        }

        .notifications {
            background-color: rgb(49, 109, 245);
            color: white;
            padding-top: 3px;
            padding-bottom: 3px;
            padding-left: 10px;
            padding-right: 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .container2{
            width:800px;
            background-color:rgb(120, 82, 178);
            border-style: solid;
            height:50px;
            border-width: 1px;
            margin-bottom: 200px;
        }
        .flexbox2{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            padding-left: 20px;
            padding-right: 20px;
            
        }
        .searchbutton{
            height: 26px;
            width:400px;
            border-radius: 13px;
            background-color: white;
            font-size: 16px;
            padding-left: 14px;
            margin-top:8px;
            margin-bottom: 5px;
        }
        .homeclass{
           margin-top:15px;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
        }
        .buttonclass{
            background-color: transparent;
            padding-left: 18px;
            padding-bottom: 6px;
            padding-top: 6px;
            padding-right: 18px;
            margin-top:8px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="flexbox">
            <div>Home</div>
            <div class="notifications">14</div>
        </div>
        <div class="flexbox">
            <div>Notifications</div>
            <div class="notifications">3</div>
        </div>
        <div class="flexbox">
            <div>Messages</div>
            <div class="notifications">5</div>
        </div>

 </div>
        <div class="container2">
            <div class="flexbox2">
                <div class="homeclass">Home</div>
                <div>
                    <input class="searchbutton" type="text" placeholder="Search">
                </div>
                <div>
                    <button class="buttonclass">Download</button>
                </div>
            </div>
        </div>


   
</body>

</html>
