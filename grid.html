<!doctype html>
<html>
  <head>
    <title>Grids</title>
  </head>
  <body>
    <div style="display: grid; grid-template-columns: 100px 100px">
      <div style="background-color: brown">div1</div>
      <div style="background-color: green">
        div2
        <p>text</p>
      </div>
    </div>
    <div
      style="margin-top: 8px; display: grid; grid-template-columns: 100px 1fr"
    >
      <div style="background-color: brown">div1</div>
      <div style="background-color: green">
        div2
        <p>text</p>
      </div>
    </div>
  </body>
</html>
