<!DOCTYPE html>
<html>
    <head>
        <title>Sign Up Form</title>
        <style>
            .button-class{
                background-color: rgb(70, 135, 240);
                font-weight: bold;
                font-size:16px;
                padding-left: 72px;
                padding-right: 72px;
                padding-top: 5px;
                padding-bottom: 5px;
                cursor: pointer;
                border: none;
                border-radius: 5px;
                margin-top: 8px;
                
            }
            .firstone{
                margin-right:2px;
                margin-bottom: 8px;
                border-radius: 4px;
                width:98px;
                border-width:1px;
            
            }
            .secondone{
            
                margin-bottom: 8px;
                  border-radius: 4px;
                  width:98px;
                  border-width: 1px;
            }
            .emailclass{
                display: block;
                  border-radius: 4px;
                  width: 208px;
                  border-width: 1px;

            }

        </style>
    </head>
    <body>
        <input class="firstone" type="text" placeholder="First name">
        <input class="secondone" type="text" placeholder="Last name">
        <input class="emailclass" type="text" placeholder="Email">
        <button class="button-class">Sign Up</button>

    </body>
</html>
